[package]
name = "sermoncut"
version = "0.1.0"
edition = "2021"
description = "Sermon Cutter engine: fetch a stream, cut the sermon, add the Sunday banner and fades, and check the result."
license = "MIT"
publish = false

[lib]
name = "sermoncut"
path = "src/lib.rs"

[[bin]]
name = "sermoncut"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
